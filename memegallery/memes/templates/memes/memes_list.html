{% extends 'memes/base.html' %}
{% block content %}
{% load static %}

<h2>Галерея мемов</h2>
<ul>
    {% for meme in memes %}
        <li>
            <h3>{{ meme.title }}</h3>
            <img src={{ meme.image.url }}>
            <p>{{ meme.description }}</p>
        </li>
    {% endfor %}
</ul>

{% endblock content %}
