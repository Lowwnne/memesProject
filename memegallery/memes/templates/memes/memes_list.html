{% extends 'memes/base.html' %}
{% block content %}
{% load static %}

<h1>{{ title }}</h1>
{% if memes %}

<ul>
{% for meme in memes %}
    <li>
        <h3><a href="{{ meme.get_absolute_url }}">{{ meme.title }}</a></h3>
        <img src="{{ meme.image.url }}">
        <br>
    </li>
{% endfor %}
</ul>

{% else %}
<p>Мемов пока нет :(</p>
{% endif %}

{% endblock content %}
