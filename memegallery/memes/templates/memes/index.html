{% extends 'memes/base.html' %}
{% block content %}
{% load static %}

<h1>Актуальные мемы</h1>
{% if recent_memes %}

<ul>
{% for meme in recent_memes %}
    <li>
        <h3><a href="{{ meme.get_absolute_url }}">{{ meme.title }}</a></h3>
        <img src="{{ meme.image.url }}">
        <br>
    </li>
{% endfor %}
</ul>

{% else %}
<p>Актуальных мемов пока нет :(</p>
{% endif %}

{% endblock content %}
